services:
  metals-tracker:
    build: .
    container_name: metals-tracker
    restart: unless-stopped
    ports:
      - "8765:8000"   # Change 8765 to any free port on your Unraid server
    volumes:
      - ./data:/data  # SQLite database persists here
    environment:
      - PRICE_CACHE_TTL_MINUTES=5    # How often to refresh spot prices
